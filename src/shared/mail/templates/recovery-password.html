<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <title>Recuperação de Senha</title>
    <style>
      body {
        font-family: "Rubik", sans-serif;
        background-color: #f9f9f9;
        color: #333;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .container {
        background-color: #ffffff;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        padding: 32px;
        max-width: 480px;
        width: 100%;
        text-align: center;
      }

      h2 {
        color: #222;
        font-size: 24px;
        margin-bottom: 16px;
      }

      p {
        color: #555;
        font-size: 16px;
        margin-bottom: 24px;
      }

      .link-container {
        margin-top: 20px;
        margin-bottom: 20px;
      }

      .reset-link {
        display: inline-block;
        background-color: #007bff;
        color: #ffffff;
        padding: 12px 20px;
        border-radius: 4px;
        font-size: 16px;
        text-decoration: none;
        font-weight: 500;
        transition: background-color 0.3s ease;
      }

      .reset-link:hover {
        background-color: #0056b3;
      }

      .note {
        font-size: 13px;
        color: #999;
        margin-top: 24px;
      }

      .note a {
        color: #007bff;
        text-decoration: none;
      }

      .note a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Recuperação de Senha</h2>
      <p>
        Você solicitou a recuperação da sua senha. Clique no botão abaixo para
        redefini-la:
      </p>
      <div class="link-container">
        <a href="{{reset_href}}" class="reset-link">Redefinir Senha</a>
      </div>
      <div class="note">
        Se você não solicitou essa ação, ignore este e-mail. Sua senha permanecerá segura.
      </div>
    </div>
  </body>
</html>
